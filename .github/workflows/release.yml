name: Release Windows installer

# Publishing a GitHub release builds the installer and attaches it. Run it by
# hand (workflow_dispatch) to rehearse the build without creating a release -
# the artefacts then land on the workflow run instead.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # to attach assets to the release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # 3.14 is what the project is developed on, and the first series PySide6
      # ships cp314 wheels for - see requirements.txt.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A release tagged v0.2.0 that ships binaries reporting 0.1.7 is a
      # support nightmare, and constants.py is the only place the version is
      # allowed to live. Fail loudly rather than shipping the mismatch.
      - name: Check the tag matches constants.APP_VERSION
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}' -replace '^v', ''
          $constants = (python -c "from bytesraw_erp.constants import APP_VERSION; print(APP_VERSION)").Trim()
          $metadata = (python -c "from importlib.metadata import version; print(version('bytesraw-erp'))").Trim()
          Write-Host "tag=$tag  constants.py=$constants  pyproject.toml=$metadata"
          if ($tag -ne $constants) {
            throw "Release tag '$tag' does not match constants.APP_VERSION '$constants'. Bump constants.py or retag."
          }
          if ($constants -ne $metadata) {
            throw "constants.APP_VERSION '$constants' does not match the version in pyproject.toml '$metadata'."
          }

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          # The runner has no GPU. Without these the QtWebEngine tests can hang
          # on Chromium's GPU process instead of falling back to software.
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --disable-software-rasterizer --no-sandbox"
        run: pytest -q

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # -SkipSums: the checksums have to be the last thing computed, after any
      # signing, or they describe files that no longer exist byte for byte.
      - name: Build the app, the installer and the portable zip
        shell: pwsh
        run: .\packaging\build.ps1 -SkipSums

      # ---------------------------------------------------------------------
      # Code signing. Inactive until the secrets exist, so an unsigned build
      # works today and signing turns itself on the moment you add them.
      #
      # Wired for Azure Trusted Signing, which is the practical option in CI:
      # since June 2023 an Authenticode key must live on a hardware token or in
      # an HSM, so the old trick of putting a .pfx in a repository secret only
      # works for certificates issued before then. DigiCert KeyLocker and
      # SSL.com eSigner are equivalent alternatives - swap the action, keep the
      # two call sites.
      #
      # The action is Azure/artifact-signing-action, renamed from
      # azure/trusted-signing-action along with the service. The old name still
      # resolves through GitHub's repository redirect, so a bump that keeps it
      # looks fine - but this step is the one thing no CI run can exercise, and
      # a redirect is not what it should rest on. Dependabot proposed v2 under
      # the old name; the name is corrected here so it tracks the right
      # repository from now on. Every input below survived the major bump.
      #
      # There are two, and both matter: the app's own exe is signed BEFORE Inno
      # packs it, because a user who inspects the installed program sees that
      # file, not the installer. The installer itself is signed by ISCC via
      # build.ps1 -SignCommand, which also covers the uninstaller it embeds -
      # signing setup.exe afterwards would leave that unsigned.
      # ---------------------------------------------------------------------
      - name: Is signing configured?
        id: signing
        shell: pwsh
        env:
          CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' }}
        run: echo "enabled=$env:CONFIGURED" >> $env:GITHUB_OUTPUT

      - name: Sign the application executable
        if: steps.signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: dist/BytesrawERP
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Rebuild the installer and zip around the signed executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          .\packaging\build.ps1 -SkipApp -SkipSums `
            -SignCommand '"C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 $f'

      # ---------------------------------------------------------------------

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          # LF and no BOM, so "sha256sum -c" works on any platform.
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", $content, (New-Object System.Text.UTF8Encoding($false)))
          $lines | Write-Host

      - uses: actions/upload-artifact@v7
        with:
          name: bytesraw-erp-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          # Already LZMA2-compressed; zipping again costs minutes and saves
          # nothing.
          compression-level: 0

      - name: Attach the artefacts to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' `
            (Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object { $_.FullName }) `
            dist/SHA256SUMS.txt --clobber

      # ---------------------------------------------------------------------
      # Announce the release on the update host.
      #
      # This runs in the same job as the build on purpose. A release that ships
      # without updating the manifest is a release nobody is ever offered, and a
      # manifest written by hand afterwards is a checksum typed twice - so the
      # numbers published here are the ones just computed, from the very files
      # that were just uploaded.
      #
      # The manifest lives on the `updates` orphan branch, which shares no
      # history with main, so this never appears in the application's diff.
      # Checking that branch out into a subdirectory rather than rewriting it
      # wholesale is what preserves the CNAME file that binding the custom
      # domain in Pages settings committed there.
      # ---------------------------------------------------------------------
      - name: Check out the update host
        if: github.event_name == 'release'
        uses: actions/checkout@v7
        with:
          ref: updates
          path: update-host

      - name: Publish the channel manifest
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Exit codes are checked explicitly below. Left on, a native command's
          # nonzero exit becomes a terminating error, and `git diff --quiet`
          # answers "there are changes" with exit 1 - which is the success path
          # here, not a failure.
          $PSNativeCommandUseErrorActionPreference = $false
          $version = '${{ github.event.release.tag_name }}' -replace '^v', ''
          # A pre-release announces itself on the beta channel and never touches
          # stable. One file per channel is the whole reason a beta that goes
          # wrong cannot reach a till following stable.
          $channel = if ('${{ github.event.release.prerelease }}' -eq 'true') { 'beta' } else { 'stable' }

          $installer = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer in dist/ to describe.' }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()

          $path = "update-host/erp/$channel.json"
          $previous = $null
          if (Test-Path $path) { $previous = Get-Content $path -Raw | ConvertFrom-Json }

          # Two fields are carried over rather than regenerated, because they are
          # decisions about the fleet and not facts about this build:
          #   minimum_supported - the floor below which an update stops being
          #     optional. Bumping it silently on every release would make every
          #     release mandatory.
          #   next_manifest_url - the only migration path an already-installed
          #     binary has. Losing it here would strand those installations.
          $minimum = '0.1.0'
          if ($previous -and $previous.minimum_supported) { $minimum = $previous.minimum_supported }
          $next = $null
          if ($previous -and $previous.next_manifest_url) { $next = $previous.next_manifest_url }

          # rollout and mandatory reset with every release: staging a rollout or
          # declaring an update compulsory is a deliberate act, done by editing
          # the manifest on this branch after the release is out. A release that
          # inherited last time's 25% would stall for reasons nobody remembers.
          $manifest = [ordered]@{
            schema            = 1
            product           = 'bytesraw-erp'
            channel           = $channel
            version           = $version
            released          = (Get-Date -Format 'yyyy-MM-dd')
            minimum_supported = $minimum
            mandatory         = $false
            rollout           = 100
            # The client enforces Authenticode only when this says there is a
            # signature to check, so it must track whether signing actually ran
            # rather than what we hope is true.
            signed            = ('${{ steps.signing.outputs.enabled }}' -eq 'true')
            notes_url         = '${{ github.event.release.html_url }}'
            next_manifest_url = $next
            artifact          = [ordered]@{
              url         = "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$($installer.Name)"
              filename    = $installer.Name
              sha256      = $sha
              size        = $installer.Length
              installer   = 'inno-setup'
              silent_args = @('/SILENT', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS')
            }
          }

          # LF and no BOM: the file is served as application/json to every till
          # in the field, and a BOM is a parse error in some JSON readers.
          $json = ($manifest | ConvertTo-Json -Depth 5).Replace("`r`n", "`n") + "`n"
          New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
          [System.IO.File]::WriteAllText("$PWD/$path", $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host $json

          git -C update-host config user.name 'github-actions[bot]'
          git -C update-host config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C update-host add "erp/$channel.json"
          if (-not (git -C update-host status --porcelain "erp/$channel.json")) {
            Write-Host "The $channel manifest already describes $version; nothing to push."
            exit 0
          }
          git -C update-host commit -m "Announce $version on the $channel channel"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the $channel manifest." }
          git -C update-host push
          if ($LASTEXITCODE -ne 0) { throw "Could not push the $channel manifest." }
