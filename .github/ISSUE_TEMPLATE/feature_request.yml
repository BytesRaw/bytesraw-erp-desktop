name: Feature request
description: Suggest something the app should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/BytesRaw/bytesraw-erp-desktop/blob/main/ROADMAP.md)
        first - it lists what is planned before 1.0.0, and also what is
        deliberately out of scope and why.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: Where this is used
      description: A point-of-sale till, a back-office desk, both?
